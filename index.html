<div id="modal"><div class="box">
  <div class="eyebrow">Your hypothesis</div>
  <h2>Add an idea to the Atlas</h2>

  <label>Name</label><input type="text" id="h-name" placeholder="e.g. Time folds at black-hole horizons">
  <label>Camp</label><select id="h-camp"></select>
  <label>Which holes does it try to fill?</label><div class="checks" id="h-holes"></div>
  <label>The idea, in plain words</label><textarea id="h-plain"></textarea>
  <label>What would it predict that we could look for?</label><textarea id="h-pred"></textarea>
  <label>What observation would kill it?</label><textarea id="h-kill"></textarea>
  <label>Author</label><input type="text" id="h-who" placeholder="Will">
  <div class="row"><button class="btn" id="h-cancel">Cancel</button><button class="btn primary" id="h-save">Add to Atlas</button></div>
